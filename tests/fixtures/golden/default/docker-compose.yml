networks:
  actools_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  db_data:

services:

  caddy:
    image: actools_caddy:custom
    pull_policy: never
    container_name: actools_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docroot:/var/www/html:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - php_prod
    networks:
      - actools_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  php_prod:
    image: actools_php:custom
    container_name: actools_php_prod
    restart: unless-stopped
    volumes:
      - ./docroot/prod:/var/www/html/prod
      - ./logs/php_prod:/var/log/php
    environment:
      PHP_MEMORY_LIMIT: "512m"
      PHP_UPLOAD_MAX_FILESIZE: "256m"
      PHP_MAX_EXECUTION_TIME: "300"
      COMPOSER_PROCESS_TIMEOUT: "600"
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
      PHP_OPCACHE_MAX_ACCELERATED_FILES: "20000"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      S3_BUCKET: ""
      STORAGE_PROVIDER: "aws"
      AWS_REGION: "us-east-1"
      S3_ENDPOINT_URL: ""
      ASSET_CDN_HOST: ""
    mem_limit: "512m"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - actools_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker_prod:
    image: actools_worker:latest
    pull_policy: never
    container_name: actools_worker_prod
    restart: unless-stopped
    command: ["bash", "-c", "while true; do sleep 60; done"]
    volumes:
      - ./docroot/prod:/var/www/html/prod
      - ./logs/worker:/var/log/worker
    environment:
      PHP_MEMORY_LIMIT: "2g"
      PHP_UPLOAD_MAX_FILESIZE: "256m"
      PHP_MAX_EXECUTION_TIME: "600"
      COMPOSER_PROCESS_TIMEOUT: "600"
      XELATEX_MODE: "local"
      XELATEX_ENDPOINT: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      S3_BUCKET: ""
      STORAGE_PROVIDER: "aws"
      AWS_REGION: "us-east-1"
      S3_ENDPOINT_URL: ""
      ASSET_CDN_HOST: ""
    mem_limit: "2g"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "php -v && xelatex --version > /dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - actools_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  db:
    image: mariadb:11.4
    container_name: actools_db
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      MARIADB_ROOT_PASSWORD: "TEST_DB_ROOT_PASS_FIXED"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./logs/db:/var/log/mysql
      - ./my.cnf:/etc/mysql/conf.d/actools.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - actools_net
    mem_limit: "2g"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: actools_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256m --maxmemory-policy allkeys-lru
    mem_limit: "256m"
    networks:
      - actools_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"


