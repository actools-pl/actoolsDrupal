name: Moscow Physics PDF Transfer

on:
  push:
    branches:
      - chatgpt-moscowpo-transfer-20260809
    paths:
      - .github/workflows/moscowpo-transfer.yml

permissions:
  contents: write

jobs:
  fetch-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-moscowpo-transfer-20260809
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4 requests
      - name: Fetch and verify 2025-2026 PDFs
        shell: bash
        run: |
          python - <<'PY'
          import csv, os, hashlib
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup, Tag

          PAGE='https://mos.olimpiada.ru/tasks/phys'
          YEAR='2025-2026'
          r=requests.get(PAGE,timeout=30); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          heading=next((h for h in soup.find_all(['h2','h3']) if YEAR in h.get_text(' ',strip=True)),None)
          if not heading: raise SystemExit('year heading not found')
          links=[]
          for el in heading.find_all_next():
              if el is not heading and el.name in ('h2','h3') and 'учебный год' in el.get_text(' ',strip=True): break
              if el.name=='a' and el.get('href'):
                  u=urljoin(PAGE,el['href'])
                  if u.lower().split('?',1)[0].endswith('.pdf'): links.append(u)
          links=list(dict.fromkeys(links))
          print('unique links',len(links))
          if len(links)!=20: raise SystemExit(f'expected 20, got {len(links)}')
          out=f'moscowpo/{YEAR}'; os.makedirs(out,exist_ok=True)
          used=set(); rows=[]; s=requests.Session()
          for i,u in enumerate(links,1):
              base=os.path.basename(urlparse(u).path) or f'{i:03d}.pdf'
              name=base
              stem,ext=os.path.splitext(base); n=2
              while name.lower() in used:
                  name=f'{stem}__{n}{ext}'; n+=1
              used.add(name.lower())
              rr=s.get(u,timeout=90); rr.raise_for_status(); data=rr.content
              if not data.startswith(b'%PDF'): raise SystemExit(f'not pdf: {u}')
              open(os.path.join(out,name),'wb').write(data)
              rows.append([i,name,len(data),hashlib.sha256(data).hexdigest(),u])
          with open(f'moscowpo/{YEAR}_manifest.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['index','filename','bytes','sha256','source_url']); w.writerows(rows)
          PY
      - name: Commit staged PDFs
        run: |
          git config user.name 'ChatGPT Archive Transfer'
          git config user.email 'actions@users.noreply.github.com'
          git add moscowpo
          git commit -m 'Stage Moscow Physics 2025-2026 PDFs' || true
          git push origin HEAD:chatgpt-moscowpo-transfer-20260809
