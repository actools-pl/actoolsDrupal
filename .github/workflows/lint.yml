name: Lint and Test
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run bats tests
        # Full suite (recursive) — the fast PR merge gate. Auto-discovers every
        # tests/**/*.bats so new phase suites are gated without editing CI. This
        # is what makes the P0-I fake-profile e2e
        # (tests/test_p0i_fake_profile_e2e.bats), the golden community-drift
        # check (tests/generated/golden_drift_test.bats), the append-only stage
        # guard (tests/installer/dispatch_stages_test.bats), and the
        # resolver-bypass + actools.sh exec-bit guards all gate on every PR.
        run: bats --print-output-on-failure -r tests/
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # actools.sh (operator entry point) — linted in CI for the first time
          # at P0-I. The four excluded codes are exactly the established sibling
          # idioms used throughout the lines below: SC2034 (vars set for
          # `set -a`/indirect use that look unused), SC2015 (the `A && B || C`
          # log-or-continue idiom), SC2164 (`cd` without `|| exit`), SC1091
          # (cannot follow dynamic `source` paths). actools.sh is NOT modified to
          # satisfy the linter — its behavior is frozen under the flag-don't-edit
          # guardrail, so idioms are excluded, not rewritten.
          shellcheck --exclude=SC2034,SC2015,SC2164,SC1091 actools.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 core/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 modules/host/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164,SC2119,SC2120 modules/db/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 modules/preflight/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 cron/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164,SC2043,SC2012,SC1090,SC1091 cli/actools
          shellcheck --exclude=SC2034,SC2015,SC2164,SC2043,SC2012,SC1090,SC1091 cli/commands/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164,SC2012 installer/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164,SC1091 modules/audit/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164,SC1090 modules/dr/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 modules/observability/*.sh
          shellcheck --exclude=SC2034,SC2164 modules/drupal/*.sh
          shellcheck --severity=warning --exclude=SC2034,SC2015,SC2164,SC1090,SC1091 modules/audit/lib/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164,SC2119,SC2120 modules/preview/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 modules/stack/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 modules/storage/*.sh
          shellcheck --exclude=SC2034,SC2015,SC2164 modules/worker/*.sh
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
