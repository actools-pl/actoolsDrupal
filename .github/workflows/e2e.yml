name: E2E Fresh Install

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install hcloud CLI
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar xz hcloud
          sudo mv hcloud /usr/local/bin/hcloud
          hcloud version

      - name: Create SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_key -N ""
          hcloud ssh-key create --name "ci-key-${{ github.run_id }}" \
            --public-key-from-file /tmp/ci_key.pub
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Provision server
        id: server
        run: |
          SERVER_NAME="actools-e2e-${{ github.run_id }}"
          SERVER_ID=$(hcloud server create \
            --name "$SERVER_NAME" \
            --type cpx22 \
            --image ubuntu-24.04 \
            --ssh-key "ci-key-${{ github.run_id }}" \
            --location nbg1 \
            --output json | jq -r '.server.id')
          echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT
          echo "server_name=$SERVER_NAME" >> $GITHUB_OUTPUT
          # Wait for IP to be assigned
          for i in $(seq 1 12); do
            IP=$(hcloud server describe "$SERVER_ID" --output json | jq -r '.public_net.ipv4.ip')
            [[ -n "$IP" && "$IP" != "null" ]] && break
            echo "Waiting for IP... attempt $i"
            sleep 5
          done
          [[ -z "$IP" || "$IP" == "null" ]] && echo "ERROR: IP never assigned" && exit 1
          echo "server_ip=$IP" >> $GITHUB_OUTPUT
          echo "Server: $SERVER_NAME ($IP)"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Wait for SSH
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 30); do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i /tmp/ci_key root@"$IP" "echo ok" 2>/dev/null && break
            sleep 10
          done

      - name: Deploy and install
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"

          # Copy repo
          rsync -az --exclude='.git' -e "ssh -o StrictHostKeyChecking=no -i /tmp/ci_key" \
            ./ root@$IP:/root/actoolsDrupal/

          # Create env file
          $SSH "printf 'BASE_DOMAIN=e2e-${{ github.run_id }}.example.com\nEMAIL=ci@example.com\nDRUPAL_VERSION=11\nPHP_VERSION=8.3\nDB_ROOT_PASS=CiTestPass123\nDRUPAL_ADMIN_PASS=CiAdmin123\nDRUPAL_ADMIN_USER=admin\nDRUPAL_ADMIN_EMAIL=admin@example.com\nENABLE_S3_STORAGE=false\nMARIADB_VERSION=11.4\nENVIRONMENT_MODE=production-isolated\nENABLE_REDIS=true\nREDIS_MEM=256mb\nWORKER_MEMORY_LIMIT=2g\nPHP_MEMORY_LIMIT=512m\nDB_MEMORY_LIMIT=2g\n' > /root/actoolsDrupal/actools.env"

          # Run the installer, preserving the log, WITHOUT letting `tee` mask a
          # non-zero install — the bug being that a pipeline's exit status is
          # tee's (0), not the installer's. pipefail plus an `if !` guard
          # propagate the installer's OWN failure regardless of the runner's
          # default shell flags (errexit is ignored inside an `if` condition,
          # so this is robust either way). The install.log artifact is still
          # uploaded by the "Upload logs" step below.
          set -o pipefail
          if ! $SSH -t "cd /root/actoolsDrupal && sudo DEBIAN_FRONTEND=noninteractive ./actools.sh install" 2>&1 | tee install.log; then
            echo "Installer exited non-zero — see the install.log artifact for details"
            exit 1
          fi

      - name: Verify settings.php injection (container-path regression guard)
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"
          SETTINGS=/root/actoolsDrupal/docroot/prod/web/sites/default/settings.php
          for marker in trusted_host_patterns_active file_private_path_active redis_cache_active "session.cookie_secure"; do
            if ! $SSH "grep -q '$marker' $SETTINGS"; then
              echo "FAIL: '$marker' not found in $SETTINGS — settings injection did not reach the served path"; exit 1
            fi
          done
          echo "PASS: all injected markers present in the served settings.php"

      - name: Run audit
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"
          AUDIT=$($SSH "/usr/local/bin/actools audit ci 2>&1" || echo "audit failed")
          echo "$AUDIT"
          # Count passes — exclude known CI false positives (no DNS/TLS in CI)
          PASS=$(echo "$AUDIT" | grep -c "PASS")
          # Only fail on CRITICAL issues that are NOT DNS/TLS related
          REAL_CRITICAL=$(echo "$AUDIT" | grep "\[CRITICAL\]" | grep -v "Site not responding\|TLS\|HTTP\|backup" | wc -l)
          echo "PASS count: $PASS"
          echo "Real CRITICAL count: $REAL_CRITICAL"
          if [[ "$PASS" -lt 10 ]] || [[ "$REAL_CRITICAL" -gt 0 ]]; then
            echo "FAIL: Too few passes ($PASS) or real CRITICAL failures ($REAL_CRITICAL)"
            exit 1
          fi
          echo "PASS: CI audit check passed — $PASS checks green, 0 real CRITICAL"

      - name: Run doctor (smoke)
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"
          # doctor returns 0/1/2 — accept 2 (warnings) since CI has no DNS/TLS/backups
          DOCTOR=$($SSH "/usr/local/bin/actools doctor 2>&1" || true)
          echo "$DOCTOR"
          if ! echo "$DOCTOR" | grep -q "ACTOOLS DOCTOR"; then
            echo "FAIL: doctor did not produce the expected header"
            exit 1
          fi
          # Deep gate must still be present (now prints in-development notice, not Pro)
          DEEP=$($SSH "/usr/local/bin/actools doctor --deep 2>&1" || true)
          if ! echo "$DEEP" | grep -q "not available in this edition"; then
            echo "FAIL: doctor --deep did not print the in-development gate"
            echo "--- gate output captured ---"
            echo "$DEEP"
            exit 1
          fi
          echo "PASS: doctor + doctor --deep gate are working"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-${{ github.run_id }}
          path: install.log

      - name: Cleanup server
        if: always()
        run: |
          hcloud server delete "${{ steps.server.outputs.server_id }}" || true
          hcloud ssh-key delete "ci-key-${{ github.run_id }}" || true
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

  # Hermetic end-to-end for the Phase-0 dispatch SEAMS — honors spec §S2 ("add
  # the fake-downstream-profile e2e to e2e.yml") and keeps the conceptual home
  # of the fake-profile e2e here, alongside the live community fresh-install.
  # It loads the REAL profiles/test.profile and drives every dispatch point
  # under ACTOOLS_PROFILE=test through the real dispatch.sh/profile.sh + the
  # real surfaces, asserting a marker per seam. That is the right shape of
  # "e2e" for what Phase 0 actually hardened (the seams, not the Drupal
  # install), so it needs no VM and no secrets and runs on every push.
  #
  # This invokes the SAME single artifact (tests/test_p0i_fake_profile_e2e.bats)
  # that rides the lint.yml bats suite as the fast PR merge gate — the
  # assertions live in exactly one place, so the two guarantees (suite gate +
  # e2e-workflow coverage) cannot silently diverge.
  fake-profile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run fake-profile dispatch e2e
        run: |
          # pipefail + `if !` so a bats failure fails the job (tee would
          # otherwise mask it), while the log is still captured for upload.
          set -o pipefail
          if ! bats --print-output-on-failure tests/test_p0i_fake_profile_e2e.bats 2>&1 | tee fake-profile-e2e.log; then
            echo "Fake-profile dispatch e2e failed — see the fake-profile-e2e.log artifact"
            exit 1
          fi
      - name: Upload e2e log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fake-profile-e2e-log-${{ github.run_id }}
          path: fake-profile-e2e.log
