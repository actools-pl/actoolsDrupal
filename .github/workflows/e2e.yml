name: E2E Fresh Install

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install hcloud CLI
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar xz hcloud
          sudo mv hcloud /usr/local/bin/hcloud
          hcloud version

      - name: Create SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_key -N ""
          hcloud ssh-key create --name "ci-key-${{ github.run_id }}" \
            --public-key-from-file /tmp/ci_key.pub
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Provision server
        id: server
        run: |
          SERVER_NAME="actools-e2e-${{ github.run_id }}"
          SERVER_ID=$(hcloud server create \
            --name "$SERVER_NAME" \
            --type cpx22 \
            --image ubuntu-24.04 \
            --ssh-key "ci-key-${{ github.run_id }}" \
            --location nbg1 \
            --output json | jq -r '.server.id')
          echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT
          echo "server_name=$SERVER_NAME" >> $GITHUB_OUTPUT
          # Wait for IP to be assigned
          for i in $(seq 1 12); do
            IP=$(hcloud server describe "$SERVER_ID" --output json | jq -r '.public_net.ipv4.ip')
            [[ -n "$IP" && "$IP" != "null" ]] && break
            echo "Waiting for IP... attempt $i"
            sleep 5
          done
          [[ -z "$IP" || "$IP" == "null" ]] && echo "ERROR: IP never assigned" && exit 1
          echo "server_ip=$IP" >> $GITHUB_OUTPUT
          echo "Server: $SERVER_NAME ($IP)"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

      - name: Wait for SSH
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 30); do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i /tmp/ci_key root@"$IP" "echo ok" 2>/dev/null && break
            sleep 10
          done

      - name: Deploy and install
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"

          # Copy repo
          rsync -az --exclude='.git' -e "ssh -o StrictHostKeyChecking=no -i /tmp/ci_key" \
            ./ root@$IP:/root/actoolsDrupal/

          # Create env file
          $SSH "printf 'BASE_DOMAIN=e2e-${{ github.run_id }}.example.com\nEMAIL=ci@example.com\nDRUPAL_VERSION=11\nPHP_VERSION=8.3\nDB_ROOT_PASS=CiTestPass123\nDRUPAL_ADMIN_PASS=CiAdmin123\nDRUPAL_ADMIN_USER=admin\nDRUPAL_ADMIN_EMAIL=admin@example.com\nENABLE_S3_STORAGE=false\nMARIADB_VERSION=11.4\nENVIRONMENT_MODE=production-isolated\nENABLE_REDIS=true\nREDIS_MEM=256mb\nWORKER_MEMORY_LIMIT=2g\nPHP_MEMORY_LIMIT=512m\nDB_MEMORY_LIMIT=2g\n' > /root/actoolsDrupal/actools.env"

          # Run the installer, preserving the log, WITHOUT letting `tee` mask a
          # non-zero install — the bug being that a pipeline's exit status is
          # tee's (0), not the installer's. pipefail plus an `if !` guard
          # propagate the installer's OWN failure regardless of the runner's
          # default shell flags (errexit is ignored inside an `if` condition,
          # so this is robust either way). The install.log artifact is still
          # uploaded by the "Upload logs" step below.
          set -o pipefail
          if ! $SSH -t "cd /root/actoolsDrupal && sudo DEBIAN_FRONTEND=noninteractive ./actools.sh install" 2>&1 | tee install.log; then
            echo "Installer exited non-zero — see the install.log artifact for details"
            exit 1
          fi

      - name: Verify settings.php injection (container-path regression guard)
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"
          SETTINGS=/root/actoolsDrupal/docroot/prod/web/sites/default/settings.php
          for marker in trusted_host_patterns_active file_private_path_active redis_cache_active "session.cookie_secure"; do
            if ! $SSH "grep -q '$marker' $SETTINGS"; then
              echo "FAIL: '$marker' not found in $SETTINGS — settings injection did not reach the served path"; exit 1
            fi
          done
          echo "PASS: all injected markers present in the served settings.php"

      - name: Run audit
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"
          AUDIT=$($SSH "/usr/local/bin/actools audit ci 2>&1" || echo "audit failed")
          echo "$AUDIT"
          # Count passes — exclude known CI false positives (no DNS/TLS in CI)
          PASS=$(echo "$AUDIT" | grep -c "PASS")
          # Only fail on CRITICAL issues that are NOT DNS/TLS related
          REAL_CRITICAL=$(echo "$AUDIT" | grep "\[CRITICAL\]" | grep -v "Site not responding\|TLS\|HTTP\|backup" | wc -l)
          echo "PASS count: $PASS"
          echo "Real CRITICAL count: $REAL_CRITICAL"
          if [[ "$PASS" -lt 10 ]] || [[ "$REAL_CRITICAL" -gt 0 ]]; then
            echo "FAIL: Too few passes ($PASS) or real CRITICAL failures ($REAL_CRITICAL)"
            exit 1
          fi
          echo "PASS: CI audit check passed — $PASS checks green, 0 real CRITICAL"

      - name: Run doctor (smoke)
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"
          # doctor returns 0/1/2 — accept 2 (warnings) since CI has no DNS/TLS/backups
          DOCTOR=$($SSH "/usr/local/bin/actools doctor 2>&1" || true)
          echo "$DOCTOR"
          if ! echo "$DOCTOR" | grep -q "ACTOOLS DOCTOR"; then
            echo "FAIL: doctor did not produce the expected header"
            exit 1
          fi
          # Deep gate must still be present (now prints in-development notice, not Pro)
          DEEP=$($SSH "/usr/local/bin/actools doctor --deep 2>&1" || true)
          if ! echo "$DEEP" | grep -q "not available in this edition"; then
            echo "FAIL: doctor --deep did not print the in-development gate"
            echo "--- gate output captured ---"
            echo "$DEEP"
            exit 1
          fi
          echo "PASS: doctor + doctor --deep gate are working"

      # ─────────────────────────────────────────────────────────────────────────
      # V2 real-install command harness (Steps A/B/C). The live-verification
      # matrix (docs/live-verification-matrix.md) DOCUMENTS each command's output
      # signature + exit contract; these steps EXECUTE the read-only safe surface
      # on the live VM and assert it. Appended after the doctor smoke; the working
      # provision/deploy/audit/doctor steps above are untouched. The SSH pattern is
      # the same fixed one the steps above use: $SSH "/usr/local/bin/actools <cmd>".
      # Each asserted signature is the stable, environment-independent part of the
      # arm's output (the header/token emitted regardless of the degraded CI
      # environment), and traces to a specific cli/actools arm (cited inline).
      # ─────────────────────────────────────────────────────────────────────────
      - name: Run read-only command surface (smoke)
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"

          # ===========================================================================
          # Step A — deterministic read-only commands. Environment facts (from the
          # "Deploy and install" step): fake domain (no real DNS/TLS),
          # ENABLE_S3_STORAGE=false (no S3), ENABLE_REDIS=true + worker_prod up.
          # So redis-info / worker-status / pdf-test CAN run; DNS/TLS/S3 paths cannot.
          #
          # SKIP LIST — encoded so each omission is intentional, not forgotten. A
          # fresh-install e2e must stay re-runnable and unattended, so we do NOT run:
          #   external dependency unmet in CI:
          #     storage-test  — S3 round-trip needs a bucket (ENABLE_S3_STORAGE=false)
          #     tunnel        — needs cloudflared (no Cloudflare in CI)
          #     health        — external HTTPS to the fake domain is unreliable;
          #                     doctor's Site check already covers the local path
          #     restore-test  — needs a backups/prod_db_*.sql.gz (+ .sha256); a fresh
          #                     install has none; doctor's Restore-test check covers it
          #   interactive (would hang an unattended runner):
          #     console, shell
          #   destructive:
          #     restore
          #   mutating (would make the e2e non-re-runnable):
          #     backup, update, restart, caddy-reload, worker-run, drush
          # (doctor + audit are already exercised by the steps above; audit --ci is
          #  pinned additively in Step C.)
          # ===========================================================================

          check() {  # $1 = command+args, $2 = signature substring (asserted present)
            local out; out=$($SSH "/usr/local/bin/actools $1 2>&1" || true)
            if ! grep -qF "$2" <<<"$out"; then
              echo "FAIL: 'actools $1' missing signature: $2"; echo "--- output ---"; echo "$out"; exit 1
            fi
            echo "OK: actools $1"
          }

          check_rc0() {  # $1 = command+args — asserts the command exits 0 on the VM
            local out rc
            out=$($SSH "/usr/local/bin/actools $1 2>&1" || true)
            # '|| true' above masks the local rc, so read the REAL remote rc separately:
            rc=$($SSH "/usr/local/bin/actools $1 >/dev/null 2>&1; echo \$?" || echo 1)
            if [ "$rc" != "0" ]; then
              echo "FAIL: 'actools $1' expected exit 0, got rc=$rc"; echo "--- output ---"; echo "$out"; exit 1
            fi
            echo "OK: actools $1 (exit 0)"
          }

          # Each signature is a stable header/token emitted by the arm BEFORE any
          # precondition that fails in CI. Arm citations are in cli/actools.
          check "status"        "actools_"                  # arm: docker compose ps — container_name actools_* (compose.sh)
          check "log-dir"       "Install Log Directory"     # arm: echo "=== Install Log Directory ==="
          check "dry-run"       "DRY-RUN"                   # arm: echo "=== DRY-RUN: Steps actools update will take ==="
          check "migrate"       "XeLaTeX Migration Guide"   # arm: echo "=== XeLaTeX Migration Guide ==="
          check "help"          "Actools Drupal Community"  # arm: default help|*) heredoc first line
          check "storage-info"  "S3 Storage Configuration"  # arm: echo "=== S3 Storage Configuration ===" (after env source)
          check "redis-info"    "used_memory"               # arm: redis-cli info memory (redis up); 'Redis not running' only if down
          check "slow-log"      "PHP-FPM slow log"          # arm: echo "=== PHP-FPM slow log for prod ===" (before docker exec)
          check "pdf-test"      "XeLaTeX Test"              # arm: echo "=== XeLaTeX Test (inside worker container) ===" (before exec)

          # worker-status: the arm is a bare `drush queue:list` exec with no header
          # token reliable across drush versions, so we assert a clean exit (0) rather
          # than a substring (DECLARED DEVIATION — see HANDOFF-V2). worker_prod is up.
          check_rc0 "worker-status"

          # ---- TENTATIVE (no-DNS environment) — the BRANCH E2E is the arbiter ----
          # Both headers are echoed by the arm BEFORE the lookup that degrades in CI,
          # and both arms return 0 on the degraded path, so these are expected green.
          # If the branch e2e shows either HARD-fails (non-zero before its header),
          # move it to the SKIP LIST above as a DECLARED DEVIATION rather than flake.
          check "tls-status"    "TLS Certificate Status"    # arm: echo "=== TLS Certificate Status ===" (before openssl; body 'not available yet')
          check "oom"           "Recent OOM Events"         # arm: echo "=== Recent OOM Events ===" (before dmesg; body 'No OOM events')

      - name: Run streaming commands (timeout-bounded)
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"

          # ===========================================================================
          # Step B — long-running read-only commands (logs/worker-logs follow `-f`;
          # stats streams `docker stats`). They never return on their own, so bound
          # each with a REMOTE `timeout`: the timeout firing (exit 124) MEANS the
          # command was streaming cleanly = SUCCESS. A real pre-stream error (exit
          # neither 0 nor 124) is a FAILURE. 8s comfortably exceeds stream startup —
          # the branch e2e confirms the bound.
          # ===========================================================================
          stream() {  # $1 = command+args, $2 = optional signature ('' to skip)
            local out rc
            out=$($SSH "timeout 8 /usr/local/bin/actools $1 2>&1" || true)
            # '|| true' masks the local rc; read the REAL remote rc (timeout → 124 on kill):
            rc=$($SSH "timeout 8 /usr/local/bin/actools $1 >/dev/null 2>&1; echo \$?" || echo 1)
            if [ "$rc" != "124" ] && [ "$rc" != "0" ]; then
              echo "FAIL: 'actools $1' errored before streaming (rc=$rc)"; echo "--- output ---"; echo "$out"; exit 1
            fi
            if [ -n "$2" ] && ! grep -qF "$2" <<<"$out"; then
              echo "FAIL: 'actools $1' missing signature: $2"; echo "--- output ---"; echo "$out"; exit 1
            fi
            echo "OK: actools $1 (streamed, rc=$rc)"
          }

          stream "logs"         ""           # arm: docker compose logs -f — content varies; clean-stream check suffices
          stream "stats"        "CONTAINER"  # arm: docker stats --no-trunc — first-frame header contains CONTAINER
          stream "worker-logs"  ""           # arm: docker compose logs -f worker_prod — content varies

      - name: Pin audit CI-mode (--ci) signature
        run: |
          IP="${{ steps.server.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -i /tmp/ci_key root@$IP"

          # ===========================================================================
          # Step C — additive pin of audit's CI-mode (--ci) path. Does NOT touch the
          # existing `audit ci` gate above or audit.sh (V2 records and pins; re-wiring
          # the gate is a separate, deliberate decision).
          #
          # FINDING (matrix / V1 doc-check), recorded verbatim: the existing gate
          # invokes `actools audit ci`; the bare word `ci` matches NONE of audit.sh's
          # flag cases (--complete|--security|--json|--ci|--deep|--security-active),
          # so `audit ci` runs in DEFAULT mode (human banner shown — the `grep
          # PASS>=10` gate is therefore sound, counting default-mode "  PASS  <msg>"
          # lines). `actools audit --ci` is the dedicated CI-mode path, pinned here.
          #
          # SIGNATURE NOTE (DECLARED DEVIATION — see HANDOFF-V2): in CI mode the arm
          # does NOT emit bracketed [PASS]/[FAIL] per-check lines. lib/output.sh
          # SUPPRESSES PASS lines and prints non-PASS as `STATUS [PRIORITY] msg [id]`
          # (output.sh:26-28); lib/report.sh then emits one machine summary line
          # `PASS=N WARN=N FAIL=N CRITICAL=N` (report.sh:14). So CI-mode is pinned by
          # two facts: the human banner is ABSENT, and that machine summary (token
          # `PASS=`) is PRESENT. Exit is NOT asserted (it depends on which checks
          # warn/fail with no DNS/TLS).
          # ===========================================================================
          OUT=$($SSH "/usr/local/bin/actools audit --ci 2>&1" || true)
          if grep -qF "=== ACTOOLS DRUPAL AUDIT ===" <<<"$OUT"; then
            echo "FAIL: 'audit --ci' did not enter CI mode — the human banner is present (should be suppressed)"
            echo "--- output ---"; echo "$OUT"; exit 1
          fi
          if ! grep -qF "PASS=" <<<"$OUT"; then
            echo "FAIL: 'audit --ci' did not emit the machine summary line (PASS=N WARN=N FAIL=N CRITICAL=N)"
            echo "--- output ---"; echo "$OUT"; exit 1
          fi
          echo "OK: audit --ci entered CI mode (human banner suppressed; machine summary 'PASS=' present)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-${{ github.run_id }}
          path: install.log

      - name: Cleanup server
        if: always()
        run: |
          hcloud server delete "${{ steps.server.outputs.server_id }}" || true
          hcloud ssh-key delete "ci-key-${{ github.run_id }}" || true
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

  # Hermetic end-to-end for the Phase-0 dispatch SEAMS — honors spec §S2 ("add
  # the fake-downstream-profile e2e to e2e.yml") and keeps the conceptual home
  # of the fake-profile e2e here, alongside the live community fresh-install.
  # It loads the REAL profiles/test.profile and drives every dispatch point
  # under ACTOOLS_PROFILE=test through the real dispatch.sh/profile.sh + the
  # real surfaces, asserting a marker per seam. That is the right shape of
  # "e2e" for what Phase 0 actually hardened (the seams, not the Drupal
  # install), so it needs no VM and no secrets and runs on every push.
  #
  # This invokes the SAME single artifact (tests/test_p0i_fake_profile_e2e.bats)
  # that rides the lint.yml bats suite as the fast PR merge gate — the
  # assertions live in exactly one place, so the two guarantees (suite gate +
  # e2e-workflow coverage) cannot silently diverge.
  fake-profile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run fake-profile dispatch e2e
        run: |
          # pipefail + `if !` so a bats failure fails the job (tee would
          # otherwise mask it), while the log is still captured for upload.
          set -o pipefail
          if ! bats --print-output-on-failure tests/test_p0i_fake_profile_e2e.bats 2>&1 | tee fake-profile-e2e.log; then
            echo "Fake-profile dispatch e2e failed — see the fake-profile-e2e.log artifact"
            exit 1
          fi
      - name: Upload e2e log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fake-profile-e2e-log-${{ github.run_id }}
          path: fake-profile-e2e.log
